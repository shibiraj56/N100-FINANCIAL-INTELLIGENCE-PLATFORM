# ==============================================================================
# N100 FINANCIAL INTELLIGENCE PLATFORM — SCREENER CONFIGURATION
# Analyst-configurable threshold presets, weights, and scoring rules.
# ==============================================================================

presets:
  quality_compounder:
    name: "Quality Compounder"
    description: "High ROE (>15%), conservative leverage (D/E < 1.0), positive FCF, and sustained 5Y revenue CAGR (>10%)."
    filters:
      roe_min: 15.0
      de_max: 1.0
      fcf_min: 0.0
      rev_cagr_5yr_min: 10.0
    sort_by: "composite_quality_score"
    sort_ascending: false

  value_pick:
    name: "Value Pick"
    description: "Attractively priced companies with P/E < 25, P/B < 5.0, D/E < 2.0, and dividend yield > 1.0%."
    filters:
      pe_max: 25.0
      pb_max: 5.0
      de_max: 2.0
      div_yield_min: 1.0
    sort_by: "composite_quality_score"
    sort_ascending: false

  growth_accelerator:
    name: "Growth Accelerator"
    description: "Fast-growing companies with 5Y PAT CAGR > 20%, 5Y Revenue CAGR > 15%, and D/E < 2.0."
    filters:
      pat_cagr_5yr_min: 20.0
      rev_cagr_5yr_min: 15.0
      de_max: 2.0
    sort_by: "pat_cagr_5yr"
    sort_ascending: false

  dividend_champion:
    name: "Dividend Champion"
    description: "Consistent cash generators with Dividend Yield > 2.0%, Dividend Payout < 80%, and positive FCF."
    filters:
      div_yield_min: 2.0
      dividend_payout_max: 80.0
      fcf_min: 0.0
    sort_by: "dividend_yield_pct"
    sort_ascending: false

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    description: "Debt-free companies (D/E = 0) with strong profitability (ROE > 12%) and scale (Revenue > 5,000 Cr)."
    filters:
      de_max: 0.0
      roe_min: 12.0
      sales_min: 5000.0
    sort_by: "return_on_equity_pct"
    sort_ascending: false

  turnaround_watch:
    name: "Turnaround Watch"
    description: "Turnaround plays with 3Y Revenue CAGR > 10%, latest year positive FCF, and declining D/E YoY."
    filters:
      rev_cagr_3yr_min: 10.0
      fcf_min: 0.0
      de_declining_yoy: true
    sort_by: "revenue_cagr_3yr"
    sort_ascending: false

composite_scoring:
  winsorize:
    lower_p: 10.0
    upper_p: 90.0
  weights:
    profitability: 0.35
    cash_quality: 0.30
    growth: 0.20
    leverage: 0.15
